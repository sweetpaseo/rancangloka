<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>LokaMedia</title>
  </head>
  <body>
    <main>
      <header>
        <strong>LokaMedia</strong>
        <span id="connection">offline</span>
      </header>
      <section class="stats">
        <div><span id="total">0</span><small>Total</small></div>
        <div><span id="active">0</span><small>Active</small></div>
        <div><span id="waiting">0</span><small>Waiting</small></div>
        <div><span id="complete">0</span><small>Done</small></div>
      </section>
      <section class="provider">
        <h2>Provider: ChatGPT</h2>
        <dl>
          <div><dt>Tab</dt><dd id="provider-tab">missing</dd></div>
          <div><dt>Auth</dt><dd id="provider-auth">unknown</dd></div>
          <div><dt>DOM</dt><dd id="provider-dom">unknown</dd></div>
          <div><dt>Composer</dt><dd id="provider-composer">unavailable</dd></div>
          <div><dt>Images</dt><dd id="provider-images">0</dd></div>
          <div><dt>Lane</dt><dd id="provider-lane">idle</dd></div>
        </dl>
      </section>
      <section>
        <label>Server <input id="server" type="url"></label>
        <label>Device token <input id="token" type="password"></label>
        <label class="inline"><input id="enabled" type="checkbox"> Enabled</label>
      </section>
      <footer>
        <button id="save">Save</button>
        <button id="tick">Run</button>
        <button id="diagnostic">Provider check</button>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
