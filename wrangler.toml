name = "rancangloka"
main = "src/worker.ts"
assets = { directory = "dist" }
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "rancangloka_db"
database_id = "3a86e9ad-410f-4440-884e-2eb813ec4cf7"
migrations_dir = "db/migrations"

# Cloudflare R2 Object Storage Binding (for covers & media)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "rancangloka-media"

# Source-Level Cron Triggers (Phase 5L9 + JEV-7A)
[triggers]
crons = [
  "0 * * * *",
  "*/5 * * * *",
  "* * * * *",
  "17 * * * *"
]

# Decision Platform (JEV-6 + JEV-7A)
[vars]
JEV_ENABLED = "true"
JEV_MODE = "shadow"
JEV_SHADOW_COLLECTOR_ENABLED = "true"
MEDIA_WORKER_ENABLED = "true"



