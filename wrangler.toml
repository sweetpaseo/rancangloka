name = "rancangloka"
main = "src/worker.ts"
assets = { directory = "dist" }
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Caching (CONTENT_PROTECTION-1A)
[cache]
enabled = true

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "rancangloka_db"
database_id = "3a86e9ad-410f-4440-884e-2eb813ec4cf7"
migrations_dir = "db/migrations"

# Cloudflare R2 Object Storage Binding (for covers & media)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "rancangloka-media"

# Cloudflare Workers AI Binding (MEDIA-CLOUDFLARE-AI-1)
[ai]
binding = "AI"

# Source-Level Cron Triggers (Phase 5L9 + JEV-7A)
[triggers]
crons = [
  "0 * * * *",
  "*/5 * * * *",
  "* * * * *",
  "17 * * * *"
]

# Decision Platform (JEV-6 + JEV-7A)
[vars]
JEV_ENABLED = "true"
JEV_MODE = "shadow"
JEV_SHADOW_COLLECTOR_ENABLED = "true"
MEDIA_WORKER_ENABLED = "true"

# ==============================================================================
# STAGING ENVIRONMENT (STRICTLY ISOLATED FROM PRODUCTION)
# ==============================================================================
[env.staging]
name = "rancangloka-staging"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Staging Cloudflare D1 Database Binding
[[env.staging.d1_databases]]
binding = "DB"
database_name = "rancangloka_staging_db"
database_id = "9e889739-0488-4667-8de8-5a731a0ae5b0"
migrations_dir = "db/migrations"

# Staging Cloudflare R2 Object Storage Binding
[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "rancangloka-media-staging"

# Cloudflare Workers AI Binding
[env.staging.ai]
binding = "AI"

# Cron Triggers in Staging: STRICTLY DISABLED
[env.staging.triggers]
crons = []

# Staging Runtime Variables (AUTO_PUBLISH STRICTLY OFF)
[env.staging.vars]
ENVIRONMENT = "staging"
AUTO_PUBLISH = "false"
JEV_ENABLED = "true"
JEV_MODE = "shadow"
JEV_SHADOW_COLLECTOR_ENABLED = "false"
MEDIA_WORKER_ENABLED = "false"




